      mastodon: https://infosec.exchange/@wdormann
    - name: Brian Krebs
      mastodon: https://infosec.exchange/@briankrebs
    - name: Troy Hunt             # Have I Been Pwned
      bluesky: troyhunt.com
    - name: Kim Zetter            # investigative journalist
