# Clients and key suppliers. A ransomware.live victim whose name or website matches one of
# these (whole words, case doesn't matter; names or domains such as acme.com) alerts.
# Keep this empty in a public repo: put the real list in the WATCH_ORGS secret, comma
# separated. Both are combined. Names never appear in logs, run summaries or saved state.
watch_orgs: []

# Victims posted on ransomware leak sites, from ransomware.live's free PRO API: every victim
# in `countries`, plus any victim matching watch_orgs. Needs the RANSOMWARE_LIVE_API_KEY
# secret (free key from https://my.ransomware.live). Victim names go to your phone only. Check ransomware.live's terms: commercial use
# needs their written approval, and the source must be credited (alerts say
# "Source: Ransomware.live"). Their data refreshes every 30 minutes, so don't poll faster.
ransomware_live:
  enabled: true
  countries: [GB]               # every victim in these countries alerts (ISO codes; UK = GB); [] to turn off
  country_priority: high        # high: phone with sound, Alexa stays quiet.
                                # "urgent" makes Alexa announce every listing (about 40 a month for the UK)
  priority: urgent              # a watched organisation (watch_orgs / WATCH_ORGS) listed by a ransomware group
  max_age_days: 7               # ignore listings discovered longer ago than this
  url: https://api-pro.ransomware.live/victims/recent   # the 100 most recent victims, for watch_orgs
  country_url: https://api-pro.ransomware.live/victims/  # victims by country and month

# Monthly feed check (the feed-check workflow): tests every news feed and social account and
# sends one message without sound listing those that failed or posted nothing for
# silent_days, with a suggested fix where it can find one. It never edits this file.
feed_check:
  enabled: true
  silent_days: 14
  # Feed or account names that are allowed to be quiet: not reported as silent (failures still are).
  quiet_ok: [Florian Roth, Costin Raiu, Boris Larin, Marcus Hutchins, Kim Zetter]
  notify_when_all_ok: false     # true also sends "all feeds are fine" when nothing needs attention

delivery:
  max_alerts_per_run: 12        # anything over this arrives as one digest message
  normal_silent: false          # false: normal alerts make a sound too (true lands them quietly)
  ntfy_server: https://ntfy.sh
  pushover_urgent_priority: 1   # 1 skips your quiet hours; 2 repeats until you acknowledge
  # During these hours phone alerts still arrive straight away, but without sound.
  # "alexa" uses the same schedule as alexa.quiet_hours below; or give a schedule in
  # the same format (e.g. "23:00-07:00"); an empty value means the phone always rings.
  phone_quiet_hours: alexa
  phone_quiet_ring_urgent: false  # true lets urgent alerts still ring during quiet hours

# Alexa through Voice Monkey. The free plan is 200 requests a month, so only urgent
# alerts are spoken and several urgent alerts in one run become one announcement.
# Alexa never speaks during quiet hours; it holds announcements and catches up after.
alexa:
  enabled: true
  min_priority: urgent
  # When Alexa stays quiet, in the timezone above. Each range belongs to the morning it
  # ends on: weekdays are Monday to Friday mornings, so 23:00-08:00 also covers Sunday
  # night, and weekends are Saturday and Sunday mornings, so Friday night is free until 01:00.
  # Other forms: one range for every day, e.g. quiet_hours: "22:00-07:30"; or add a single
  # day such as friday: "00:00-09:00" to override it; an empty value means no quiet hours.
  quiet_hours:
    weekdays: "23:00-08:00"
    weekends: "01:00-11:00"
  queue_during_quiet_hours: true  # hold announcements and speak them when quiet hours end
  queue_max_age_hours: 24         # drop held announcements older than this
  monthly_cap: 150
  voice: ""                     # optional, e.g. Brian or Amy
  chime: ""                     # optional soundbank URL from the Voice Monkey docs
