# Threat notifier settings. Edit, commit, and the next scheduled run uses them.

timezone: Europe/London

# CISA Known Exploited Vulnerabilities: every new entry alerts.
# It's urgent when ransomware use is known or the vendor is on your watchlist.
kev:
  enabled: true

# New CVEs from NVD, published in the last 30 days with CVSS of at least min_cvss.
# A CVE alerts when EPSS reaches epss_threshold, or when it's critical (CVSS of at least
# watchlist_min_cvss, network-exploitable with no login) on a watchlist vendor.
#   urgent: EPSS hit plus a critical on the core list, or EPSS at urgent_epss on any critical
#   high:   EPSS hit on its own, or a critical on the core list
#   normal: a critical on the extended list (arrives silently)
cve:
  min_cvss: 7.0
  epss_threshold: 0.10          # 10% chance of exploitation in the next 30 days
  urgent_epss: 0.50
  watchlist_min_cvss: 9.0
  watchlist_requires_unauthenticated: true
  watch_days: 14                # keep re-checking EPSS this long, so a later jump still alerts
  max_published_age_days: 30    # older CVEs only alert through KEV
  max_window_hours: 168         # how far back to look after downtime

# Three layers, all matched as whole words (case doesn't matter):
#   auto_from_kev adds every vendor CISA has listed in KEV at least auto_min_kev_entries
#     times, refreshed each run. It's the best free proxy for "widely deployed and attacked".
#   core is where a KEV entry or a critical is loud: edge devices, identity, remote access
#     and RMM, hypervisors, backup, file transfer and the biggest targets.
#   extended is everything else worth knowing about across a wide client base.
#   ignore drops CVEs from sources that flood NVD with criticals nobody runs. It never
#     blocks KEV alerts. Remove anything your clients actually use.
#   msp_critical is a sub-list of core (anything here also counts as core): the RMM, PSA,
#     remote access and identity providers whose breach would reach every client at once.
#     A headline naming one of them with a word from news.vendor_breach_keywords is urgent.
