news:
  max_age_days: 3
  # One alert per story. Headlines that share a CVE ID, or a watchlist vendor plus at least
  # story_min_shared_words significant words (generic words like "patch" or "flaw" don't
  # count), are grouped: the alert keeps the highest priority and the earliest title, and
  # lists the other outlets. A story seen again within story_window_hours doesn't re-alert.
  group_stories: true
  story_window_hours: 24
  story_min_shared_words: 3
  # Words in a headline that make an item high priority, or urgent with a watchlist match.
  hot_keywords:
    - zero-day
    - zero day
    - 0-day
    - actively exploited
    - exploited in the wild
    - exploited in attacks
    - under active exploitation
    - mass exploitation
    - emergency patch
    - emergency update
    - out-of-band
    - supply chain attack
    - supply-chain attack
    - wormable
  # A headline naming a core watchlist vendor plus one of these words is high priority even
  # without zero-day wording, and urgent when the vendor is on watchlist.msp_critical.
  # Such headlines always get through, even from feeds filtered by keywords.
  vendor_breach_keywords:
    - breach
    - breached
    - compromised
    - hacked
    - supply chain attack
    - stolen
    - malicious update
    - backdoored
  # Feeds set to "keywords" only alert when the title or summary has one of these.
  keywords:
    - zero-day
    - zero day
    - 0-day
    - exploited
    - exploitation
    - actively exploited
    - emergency patch
    - out-of-band
    - critical vulnerability
    - critical flaw
    - remote code execution
    - rce
    - ransomware
    - data breach
    - breach
    - breached
    - hacked
    - compromised
    - compromise
    - supply chain
    - supply-chain
    - backdoor
    - backdoored
    - extortion
    - stolen
    - leak
    - leaked
    - outage
    - known exploited
    - infostealer
  # filter: "all" alerts on every new post; "keywords" filters. A feed can set its own keywords.
  feeds:
    - name: NCSC
      url: https://www.ncsc.gov.uk/api/1/services/v1/all-rss-feed.xml
      filter: keywords
    - name: BleepingComputer
      url: https://www.bleepingcomputer.com/feed/
      filter: keywords
    - name: The Hacker News
      url: https://feeds.feedburner.com/TheHackersNews
      filter: keywords
    - name: The Record
      url: https://therecord.media/feed/
      filter: keywords
    - name: SANS ISC
      url: https://isc.sans.edu/rssfeed_full.xml
      filter: keywords
    - name: Huntress
      url: https://www.huntress.com/blog/rss.xml
      filter: all
    - name: DoublePulsar
      url: https://doublepulsar.com/feed
      filter: all
    - name: watchTowr Labs
      url: https://labs.watchtowr.com/rss/
      filter: all
    - name: Krebs on Security
      url: https://krebsonsecurity.com/feed/
      filter: all
    - name: r/sysadmin
      url: https://www.reddit.com/r/sysadmin/new/.rss
      filter: keywords
      keywords: [breach, breached, compromised, zero-day, 0-day, actively exploited, ransomware, outage, psa, supply chain, backdoor, malicious update]
    - name: Have I Been Pwned
      url: https://feeds.feedburner.com/HaveIBeenPwnedLatestBreaches
      filter: all
    - name: DataBreaches.net
      url: https://databreaches.net/feed/
      filter: keywords
    - name: Securelist            # Kaspersky GReAT's research blog
      url: https://securelist.com/feed/
      filter: keywords

# Mastodon and Bluesky accounts, read through their public RSS feeds (no login or API key).
# Posts always go through news.keywords (or an account's own `keywords`), are grouped with
# news stories, and stay normal priority unless the post has a news.hot_keywords word AND
# names a core watchlist vendor; then they get hot_vendor_priority.
#   mastodon: the profile URL (https://server/@user) or @user@server; the feed is URL + .rss
#   bluesky:  the handle (name.bsky.social or a domain); the feed is bsky.app/profile/HANDLE/rss
# Add `enabled: false` to mute one account. Each account was checked on 2026-11-01.
social:
  enabled: true
  hot_vendor_priority: high     # urgent would also make Alexa read the post out
  accounts:
    # Researchers
    - name: Florian Roth          # Nextron Systems; Sigma and THOR. Quiet here since March 2025 (mostly on X)
      mastodon: https://infosec.exchange/@cyb3rops
