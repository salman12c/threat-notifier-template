name: drill

# Manual only. Sends real alerts through the notifier, labelled DRILL: a CVE as if NVD had
# just published it, a KEV entry as if CISA had just added it, headlines as if your news
# feeds had just posted them, or a recent ransomware listing in your countries. The
# notifier's saved state is never touched.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "What to drill"
        type: choice
        options: [cve, kev, news, ransomware]
        default: cve
      cve:
        description: "CVE ID for a cve or kev drill, e.g. CVE-2026-111497"
        required: false
        type: string
      headlines:
        description: "news drill: 'Feed name: headline', several separated by ||"
        required: false
        type: string
      ignore_quiet_hours:
        description: "Let Alexa speak and the phone ring even during quiet hours"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run drill
        env:
          KIND: ${{ inputs.kind }}
          CVE: ${{ inputs.cve }}
          HEADLINES: ${{ inputs.headlines }}
          QUIET_FLAG: ${{ inputs.ignore_quiet_hours && '--ignore-quiet-hours' || '' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          VOICEMONKEY_TOKEN: ${{ secrets.VOICEMONKEY_TOKEN }}
          VOICEMONKEY_DEVICE: ${{ secrets.VOICEMONKEY_DEVICE }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          RANSOMWARE_LIVE_API_KEY: ${{ secrets.RANSOMWARE_LIVE_API_KEY }}
        run: |
          case "$KIND" in
            ransomware) python tools/drill.py --ransomware --live $QUIET_FLAG ;;
            kev)        python tools/drill.py --kev "$CVE" --live $QUIET_FLAG ;;
            news)       python tools/drill.py --news "$HEADLINES" --live $QUIET_FLAG ;;
            *)          python tools/drill.py "$CVE" --live $QUIET_FLAG ;;
          esac
